{
  "queries": {
    "purple_r09_shadow_readers": {
      "query": "SELECT pid, name, cmdline FROM processes WHERE cmdline LIKE '%/etc/shadow%';",
      "interval": 120,
      "description": "R09: shadow 를 여는 프로세스"
    },
    "purple_r09_new_cron": {
      "query": "SELECT path, datetime(mtime,'unixepoch') AS mtime FROM file WHERE directory = '/etc/cron.d' AND mtime > (strftime('%s','now') - 86400*7);",
      "interval": 600,
      "description": "R09: 최근 7일 /etc/cron.d 변경"
    },
    "purple_r09_lastlog_s2s": {
      "query": "SELECT username, host, datetime(time,'unixepoch') AS t FROM last WHERE host LIKE '10.20.40.%';",
      "interval": 600,
      "description": "R09: 서버존 출발 로그인"
    },
    "purple_r05_empty_logs": {
      "query": "SELECT path, size FROM file WHERE path IN ('/var/log/auth.log','/root/.bash_history') AND size = 0;",
      "interval": 600,
      "description": "R05: 비워진 인증 로그·히스토리"
    }
  }
}