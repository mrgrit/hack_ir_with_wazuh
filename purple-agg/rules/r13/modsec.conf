# R13 — ModSecurity (id 913xx) · 사람 속도를 넘는 클라이언트를 늦춘다
SecAction "id:91301,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"
SecRule &IP:R13_REQ "@eq 0" "id:91304,phase:1,nolog,pass,setvar:ip.r13_req=0,expirevar:ip.r13_req=10"
SecAction "id:91305,phase:1,nolog,pass,setvar:ip.r13_req=+1"
SecRule IP:R13_REQ "@gt 50" "id:91302,phase:1,deny,status:429,log,msg:'PURPLE R13 rate limit - %{ip.r13_req} req/10s',tag:'purple/r13'"
SecRule REQUEST_HEADERS:User-Agent "@rx ^(?:python-httpx|python-requests|aiohttp|Go-http-client)/" \
  "id:91303,phase:1,pass,log,msg:'PURPLE R13 automation UA (observe)',tag:'purple/r13'"
