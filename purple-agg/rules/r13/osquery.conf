{
  "queries": {
    "purple_r13_node_shell": {
      "query": "SELECT p.pid, p.cmdline, pp.name AS parent, datetime(p.start_time,'unixepoch') AS started FROM processes p JOIN processes pp ON p.parent = pp.pid WHERE pp.name = 'node' AND p.name IN ('sh','bash','dash');",
      "interval": 60, "description": "R13: node(웹앱)가 띄운 셸 — 짧은 interval 로 기계 속도를 따라간다"
    },
    "purple_r13_ssh_keys_read": {
      "query": "SELECT pid, cmdline FROM processes WHERE cmdline LIKE '%.ssh/id_%' OR cmdline LIKE '%known_hosts%';",
      "interval": 60, "description": "R13: SSH 키·known_hosts 를 여는 프로세스"
    }
  }
}
