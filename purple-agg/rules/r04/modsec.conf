# R04 — ModSecurity (id 904xx)
# 업로드 폴더의 .php 는 절대 실행 대상이 아니다
SecRule REQUEST_FILENAME "@rx ^/uploads/.*\.ph(?:p\d?|tml|ar)$" \
  "id:90401,phase:1,deny,status:403,log,msg:'PURPLE R04 script request under /uploads',tag:'purple/r04',tag:'attack-webshell'"
# 업로드 파일명 이중 확장자(.php.jpg 등)·PHP 시그니처 (FILES = 원래 파일명, FILES_NAMES = 폼 필드 이름)
SecRule FILES "@rx (?i)\.ph(?:p\d?|tml|ar)(?:\.|$)" \
  "id:90402,phase:2,deny,status:403,log,msg:'PURPLE R04 PHP upload attempt',tag:'purple/r04'"
SecRule FILES_TMP_CONTENT "@rx <\?(?:php|=)" \
  "id:90403,phase:2,deny,status:403,log,msg:'PURPLE R04 PHP code inside uploaded file',tag:'purple/r04'"
