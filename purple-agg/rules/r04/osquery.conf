{
  "queries": {
    "purple_r04_php_in_uploads": {
      "query": "SELECT path, size, datetime(mtime,'unixepoch') AS mtime FROM file WHERE path LIKE '/var/www/%/uploads/%%' AND (path LIKE '%.php' OR path LIKE '%.phtml');",
      "interval": 300, "description": "R04: 업로드 폴더의 스크립트 파일"
    },
    "purple_r04_cron_tmp": {
      "query": "SELECT * FROM crontab WHERE command LIKE '%/tmp/%' OR command LIKE '%/dev/shm/%';",
      "interval": 600, "description": "R04: /tmp·/dev/shm 을 실행하는 cron"
    },
    "purple_r04_new_users": {
      "query": "SELECT uid, username, shell, directory FROM users WHERE uid >= 1000 AND shell NOT LIKE '%nologin';",
      "interval": 600, "description": "R04: 로그인 가능한 일반 계정 목록(기준선과 비교)"
    },
    "purple_r04_root_keys": {
      "query": "SELECT * FROM authorized_keys WHERE uid = 0;",
      "interval": 600, "description": "R04: root authorized_keys"
    }
  }
}
