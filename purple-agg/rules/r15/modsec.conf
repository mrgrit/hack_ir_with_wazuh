# R15 — ModSecurity (id 915xx) · 관리콘솔 내보내기 API 는 내부 서비스가 부를 일이 없다
SecRule REQUEST_URI "@beginsWith /api/users/export" "id:91501,phase:1,deny,status:403,log,chain,msg:'PURPLE R15 export API from service host %{REMOTE_ADDR}',tag:'purple/r15'"
  SecRule REMOTE_ADDR "@ipMatch 10.20.40.0/24"
# 허가된 점검업체는 R02/R13 카운터에서 제외 (ctl 로 규칙 끄기 — 차단이 아니라 '알고 허용')
SecRule REMOTE_ADDR "@ipMatch 125.42.78.218" "id:91502,phase:1,pass,log,msg:'PURPLE R15 authorized scanner',ctl:ruleRemoveById=90202-90204,ctl:ruleRemoveById=91301-91302,tag:'purple/r15'"
