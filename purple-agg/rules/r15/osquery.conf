{
  "queries": {
    "purple_r15_office_children": {
      "query": "SELECT p.pid, p.name, p.cmdline, pp.name AS parent FROM processes p JOIN processes pp ON p.parent = pp.pid WHERE lower(pp.name) IN ('winword.exe','excel.exe') AND lower(p.name) IN ('powershell.exe','cmd.exe','mshta.exe');",
      "interval": 60, "description": "R15: (Windows) Office 자식 셸"
    },
    "purple_r15_beacon_sockets": {
      "query": "SELECT p.name, p.path, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p USING(pid) WHERE lower(p.name) = 'powershell.exe' AND s.remote_port = 443;",
      "interval": 300, "description": "R15: (Windows) powershell 의 외부 443 연결"
    }
  }
}
