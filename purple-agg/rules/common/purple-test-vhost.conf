# purple-test.kt66.lab — ModSecurity 룰 검증 전용 스텁 vhost (kt66-web 에 설치)
#  · 응답은 항상 "ok" 한 줄 — 어떤 취약 앱에도 프록시하지 않는다(실제 공격 아님)
#  · 재생기(purple_http_replay.py)가 원래 로그의 출발지·상태코드를 헤더로 보내면 스텁이 그대로 흉내 낸다
#      X-Purple-Client: 원래 출발지 IP  → mod_remoteip 가 REMOTE_ADDR 로 바꿔 ModSec 의 IP 별 카운터가 실제처럼 동작
#      X-Purple-Status: 원래 응답 코드  → stub.cgi 가 그 코드로 응답 (401·403·404·503 기반 카운터 검증)
#  · 퍼플 룰은 이 vhost 안에서만 적용: /etc/modsecurity/purple/*.conf
#  · 필요 모듈: a2enmod security2 remoteip cgid
<VirtualHost *:80>
    ServerName purple-test.kt66.lab
    DocumentRoot /var/www/purple-test
    RemoteIPHeader X-Purple-Client
    RemoteIPInternalProxy 127.0.0.1 10.20.0.0/16
    <Directory /var/www/purple-test>
        Require all granted
        Options +ExecCGI
        AddHandler cgi-script .cgi
        FallbackResource /stub.cgi
        DirectoryIndex stub.cgi
    </Directory>
    SecRuleEngine On
    SecRequestBodyAccess On
    SecTmpSaveUploadedFiles On
    SecAuditEngine RelevantOnly
    SecAuditLog ${APACHE_LOG_DIR}/purple_test_modsec_audit.log
    IncludeOptional /etc/modsecurity/purple/*.conf
    ErrorLog ${APACHE_LOG_DIR}/purple_test_error.log
    CustomLog ${APACHE_LOG_DIR}/purple_test_access.log combined
</VirtualHost>
