# R06 — ModSecurity (id 906xx) · IP 가 아니라 '계정' 기준으로 센다 (분산 대입 대응)
SecRule ARGS_POST:_user "@rx ^[a-z0-9._-]{3,64}$" \
  "id:90601,phase:2,nolog,pass,initcol:resource=webmail_%{ARGS_POST._user},setvar:tx.r06_user=%{ARGS_POST._user}"
SecRule RESOURCE:FAIL "@ge 10" \
  "id:90602,phase:2,deny,status:429,log,msg:'PURPLE R06 account %{tx.r06_user} locked - %{resource.fail} failures from many IPs',tag:'purple/r06'"
SecRule RESPONSE_STATUS "@streq 401" "id:90603,phase:5,nolog,pass,chain"
  SecRule &RESOURCE:FAIL "@eq 0" "chain"
    SecRule TX:R06_USER "@rx ." "setvar:resource.fail=0,expirevar:resource.fail=86400"
SecRule RESPONSE_STATUS "@streq 401" "id:90604,phase:5,nolog,pass,chain"
  SecRule TX:R06_USER "@rx ." "setvar:resource.fail=+1"
