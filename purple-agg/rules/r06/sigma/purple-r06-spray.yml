title: PURPLE R06 Webmail Login Failure
name: purple_r06_fail
id: purple-r06-fail
status: experimental
logsource:
    product: kt66
    service: webmail-auth
detection:
    app:
        app|re: '"app":\s?"webmail"'
    fail:
        result|re: '"result":\s?"fail"'
    condition: app and fail
level: informational
---
title: PURPLE R06 Password Spray - 5 sources per account per week
id: purple-r06-spray-corr
status: experimental
correlation:
    type: value_count
    rules:
        - purple_r06_fail
    group-by:
        - srcuser
    timespan: 7d
    condition:
        gte: 5
        field: srcip
level: high
tags:
    - attack.t1110.003
---
title: PURPLE R06 Lookalike Sender Domain
name: purple_r06_lookalike
id: purple-r06-lookalike
status: experimental
logsource:
    product: kt66
    service: mailgw
detection:
    selection:
        keywords:
            - 'direction=in'
    dom:
        keywords:
            - '@kt66-'
    condition: selection and dom
level: medium
tags:
    - attack.t1566.001
