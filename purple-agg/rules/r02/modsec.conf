# R02 — ModSecurity (id 902xx) · purple-test vhost 전용
# 1) 숨은 관리 API 경로는 외부에 존재하지 않는다 → 403 + 로그
SecRule REQUEST_URI "@rx ^/api/v1/(?:admin/users|accounts/export)" \
  "id:90201,phase:1,deny,status:403,log,msg:'PURPLE R02 hidden API probe',tag:'purple/r02',tag:'attack-recon'"
# 2) IP 별 404 를 세어 2분 30회를 넘으면 그 IP 의 이후 요청 차단 (응답 단계에서 세고, 요청 단계에서 막는다)
#    주의: expirevar 를 요청마다 다시 걸면 창이 계속 밀려(슬라이딩) 느린 정상 사용자도 누적된다 → 처음 만들 때 한 번만 건다(고정 창)
SecAction "id:90202,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"
SecRule IP:R02_404 "@gt 30" "id:90203,phase:1,deny,status:429,log,msg:'PURPLE R02 404 storm - client throttled (%{ip.r02_404})',tag:'purple/r02'"
SecRule RESPONSE_STATUS "@streq 404" "id:90204,phase:5,nolog,pass,chain"
  SecRule &IP:R02_404 "@eq 0" "setvar:ip.r02_404=0,expirevar:ip.r02_404=120"
SecRule RESPONSE_STATUS "@streq 404" "id:90205,phase:5,nolog,pass,setvar:ip.r02_404=+1"
