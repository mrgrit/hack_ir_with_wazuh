# R12 — ModSecurity (id 912xx) · aicompanion 앞단
SecRule REQUEST_URI "@beginsWith /api/debug" \
  "id:91201,phase:1,deny,status:404,log,msg:'PURPLE R12 debug endpoint hidden',tag:'purple/r12'"
# JSON 본문: modsecurity.conf 의 200001 이 JSON 파서를 켜면 값은 ARGS(json.message)로, 파서가 없으면 REQUEST_BODY 로 본다
SecRule REQUEST_URI "@beginsWith /api/chat" "id:91200,phase:1,pass,nolog,ctl:forceRequestBodyVariable=On"
SecRule REQUEST_URI "@beginsWith /api/chat" "id:91202,phase:2,deny,status:400,log,chain,t:none,t:lowercase,msg:'PURPLE R12 prompt injection phrase',tag:'purple/r12',tag:'llm-prompt-injection'"
  SecRule ARGS|REQUEST_BODY "@rx (?:ignore (?:all|previous|prior) instructions|system prompt|developer mode|이전 지시(?:를|는) 무시)" "t:none,t:lowercase"
# 프롬프트 길이 상한 (정상 사용자 99분위수 ≈ 1,500자 — lab 미션 4 집계 결과로 정한다)
SecRule REQUEST_URI "@beginsWith /api/chat" "id:91203,phase:2,deny,status:413,log,chain,msg:'PURPLE R12 oversized prompt',tag:'purple/r12'"
  SecRule REQUEST_HEADERS:Content-Length "@gt 6000"
# RAG 업로드 문서 안의 주입 문구
SecRule FILES_TMP_CONTENT "@rx (?i)(?:ignore (?:all|previous) instructions|system prompt)" \
  "id:91204,phase:2,deny,status:400,log,msg:'PURPLE R12 injection phrase inside RAG upload',tag:'purple/r12'"
