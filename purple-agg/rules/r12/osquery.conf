{
  "queries": {
    "purple_r12_ai_children": {
      "query": "SELECT p.pid, p.name, p.cmdline, pp.name AS parent FROM processes p JOIN processes pp ON p.parent = pp.pid WHERE pp.name IN ('python3','uvicorn','gunicorn','node') AND p.name IN ('sh','bash','curl','wget');",
      "interval": 120, "description": "R12: AI 서비스 프로세스가 띄운 셸·다운로더 (도구 남용)"
    },
    "purple_r12_ai_egress": {
      "query": "SELECT p.name, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p USING(pid) WHERE p.name IN ('python3','uvicorn','gunicorn','node') AND s.remote_address LIKE '10.20.40.%';",
      "interval": 120, "description": "R12: AI 서비스의 동서 연결"
    }
  }
}
