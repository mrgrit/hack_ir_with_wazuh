{
  "queries": {
    "purple_r01_outbound_nonstd": {
      "query": "SELECT p.pid, p.name, p.path, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_port NOT IN (0, 53, 80, 443) AND s.remote_address NOT LIKE '10.%' AND s.remote_address NOT LIKE '127.%' AND s.state = 'ESTABLISHED';",
      "interval": 300, "description": "R01: 외부 비표준 포트로 연결된 프로세스 (비콘 후보)"
    },
    "purple_r01_tmp_exec": {
      "query": "SELECT pid, name, path, cmdline FROM processes WHERE path LIKE '/tmp/%' OR path LIKE '/dev/shm/%';",
      "interval": 300, "description": "R01: /tmp·/dev/shm 에서 실행 중인 프로세스 (sandcat 기본 드롭 위치)"
    }
  }
}
