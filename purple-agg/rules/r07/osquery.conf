{
  "queries": {
    "purple_r07_ssh_sources": {
      "query": "SELECT username, host, datetime(time,'unixepoch') AS t FROM last WHERE type = 7 AND host NOT IN ('10.20.30.201','');",
      "interval": 600, "description": "R07: bastion 이 아닌 곳에서 들어온 SSH 로그인(서버→서버)"
    },
    "purple_r07_outbound_ssh": {
      "query": "SELECT p.name, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p USING(pid) WHERE s.remote_port = 22 AND s.remote_address LIKE '10.20.40.%';",
      "interval": 300, "description": "R07: 서버에서 다른 서버로 나가는 SSH"
    }
  }
}
