{
  "queries": {
    "purple_r10_lock_count": {
      "query": "SELECT directory, COUNT(*) AS n FROM file WHERE path LIKE '/srv/share/%%' AND filename LIKE '%.kt66lock' GROUP BY directory;",
      "interval": 300, "description": "R10: 공유폴더 암호화 파일 수 (폴더별)"
    },
    "purple_r10_miner_proc": {
      "query": "SELECT pid, name, path, cmdline FROM processes WHERE cmdline LIKE '%stratum+tcp%' OR name IN ('xmrig','minerd','t-rex','lolminer');",
      "interval": 300, "description": "R10: 마이너 프로세스"
    },
    "purple_r10_pool_sockets": {
      "query": "SELECT p.name, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p USING(pid) WHERE s.remote_port IN (3333,4444,5555,7777,14444);",
      "interval": 300, "description": "R10: 마이닝 풀 포트 연결"
    }
  }
}
