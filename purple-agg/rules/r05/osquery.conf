{
  "queries": {
    "purple_r05_fake_kthread": {
      "query": "SELECT pid, name, path, cmdline, parent FROM processes WHERE name LIKE '[%' AND path != '';",
      "interval": 300, "description": "R05: 커널 스레드처럼 대괄호 이름인데 실행 파일 경로가 있는 프로세스(위장)"
    },
    "purple_r05_shm_exec": {
      "query": "SELECT pid, name, path FROM processes WHERE path LIKE '/dev/shm/%' OR path LIKE '/tmp/%' OR on_disk = 0;",
      "interval": 300, "description": "R05: 메모리·임시 경로 실행 또는 삭제된 실행 파일"
    },
    "purple_r05_empty_logs": {
      "query": "SELECT path, size FROM file WHERE path IN ('/var/log/auth.log','/root/.bash_history') AND size = 0;",
      "interval": 600, "description": "R05: 비워진 인증 로그·히스토리"
    },
    "purple_r05_wazuh_agent": {
      "query": "SELECT id, active_state, sub_state FROM systemd_units WHERE id = 'wazuh-agent.service';",
      "interval": 300, "description": "R05: wazuh-agent 동작 상태"
    }
  }
}
