# R03 — ModSecurity (id 903xx) · CRS 우회(이중 인코딩·주석 섞기)를 보강
SecRule REQUEST_URI|ARGS "@rx %25(?:27|22|3c|2f)" \
  "id:90301,phase:1,deny,status:403,log,t:none,msg:'PURPLE R03 double URL encoding',tag:'purple/r03',tag:'attack-sqli'"
SecRule ARGS "@rx (?i)/\*.*?\*/\s*(?:union|select|or|and)\b" \
  "id:90302,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,msg:'PURPLE R03 SQL inline-comment obfuscation',tag:'purple/r03',tag:'attack-sqli'"
# 같은 IP 가 10분에 20번 이상 차단되면 이후 모든 요청 차단(차단→우회 전환을 끊는다)
SecAction "id:90303,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"
SecRule IP:R03_BLOCKS "@ge 20" "id:90304,phase:1,deny,status:403,log,msg:'PURPLE R03 repeat offender (%{ip.r03_blocks} blocks)',tag:'purple/r03'"
SecRule RESPONSE_STATUS "@streq 403" "id:90305,phase:5,nolog,pass,chain"
  SecRule &IP:R03_BLOCKS "@eq 0" "setvar:ip.r03_blocks=0,expirevar:ip.r03_blocks=600"
SecRule RESPONSE_STATUS "@streq 403" "id:90306,phase:5,nolog,pass,setvar:ip.r03_blocks=+1"
