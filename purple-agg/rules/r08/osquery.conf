{
  "queries": {
    "purple_r08_8443": {
      "query": "SELECT p.name, p.path, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p USING(pid) WHERE s.remote_port IN (8443, 4444, 8888) AND s.remote_address NOT LIKE '10.%';",
      "interval": 300, "description": "R08: 비표준 포트 외부 연결 프로세스 (Windows/Linux 공용)"
    },
    "purple_r08_dns_cache": {
      "query": "SELECT name, type FROM dns_cache WHERE length(name) > 60;",
      "interval": 600, "description": "R08: (Windows) DNS 캐시의 긴 이름"
    }
  }
}
