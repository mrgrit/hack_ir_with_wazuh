lab_id: purple-agg-r05
title: "퍼플 집계 R05 — 권한상승·방어회피 — 끊긴 로그도 신호다"
version: purple-agg-1
course: purple-agg
week: 5
description: |
  R05 권한상승·방어회피 — sudo 를 쓰지 않던 계정, /dev/shm 의 [kworker], 그리고 '로그가 끊긴 2시간'.

  Red(로그로만 재현) — mediforum(10.20.40.85), www-data 셸에서
    1) sudo -l 실패 반복 → find -exec 로 root 셸   2) /dev/shm 에 커널 스레드 이름으로 위장한 프로세스
    3) auth.log 비우기·history 삭제·wazuh-agent 중지 → 약 2시간 로그 공백   4) 재시작 후 FIM 이 삭제를 보고
  Blue: sudo 사용자 분포 → www-data 명령 → 10분 단위 0건 구간 → 수상 경로 실행 → 삭제 파일 → 타임라인

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "sudo 사용자×결과 집계로 서비스 계정의 sudo 시도를 찾는다"
  - "1시간 버킷 Date Histogram(min_doc_count 0)으로 로그 공백 구간을 찾는다"
  - "/tmp·/dev/shm 실행과 파일 삭제 경로로 방어회피 흔적을 확인한다"
  - "Wazuh(서비스 계정 sudo·반복 실패·에이전트 끊김)·osquery(위장 프로세스) 규칙과 공백 모니터를 만든다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — sudo 사용자 × 결과(rule.id)
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. sudo 를 쓰는 사람은 정해져 있다(관리자 15명). 목록 밖의 이름이 신호다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r05_privesc_evasion.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r05_privesc_evasion.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r05_privesc_evasion.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r05 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r05_privesc_evasion.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r05/_search -d @- <<'EOF' | jq -r '.aggregations.u.buckets[] | .key as $k | .r.buckets[] | "\($k) | \(.key) | \(.doc_count)"'
      {"size":0,"query":{"term":{"decoder.name":"sudo"}},"aggs":{"u":{"terms":{"field":"data.srcuser","size":20,"order":{"_key":"asc"}},"aggs":{"r":{"terms":{"field":"rule.id","size":2}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r05_privesc_evasion.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `data.srcuser` size 20 · 정렬 _key asc → Split rows: Terms `rule.id` size 2 · 필터 `decoder.name:"sudo"`

      ## ✅ 합격 기준
      `kim.chaewon` 출력 시 통과.
    hint: "gen → ask Q0 → Q1"
