      cat rules/r13/osquery.conf

      # 13) 대표 쿼리를 즉석 실행 (kt66-web) — R13: node(웹앱)가 띄운 셸 — 짧은 interval 로 기계 속도를 따라간다
      docker exec kt66-web osqueryi --json "SELECT p.pid, p.cmdline, pp.name AS parent, datetime(p.start_time,'unixepoch') AS started FROM processes p JOIN processes pp ON p.parent = pp.pid WHERE pp.name = 'node' AND p.name IN ('sh','bash','dash');"
      ```
      - Suricata: threshold 는 '서명 한 줄'의 집계다. 분산·장기 패턴은 서명으로 안 잡히는 것이 정상 — 미션 2~5 의 집계와 비교한다.
      - ModSecurity: 재생은 석 달을 몇 초로 압축한다 → 하루·주 단위 카운터는 부풀려진다. 임계값은 집계(미션 2~4)의 분포로 정한다.
