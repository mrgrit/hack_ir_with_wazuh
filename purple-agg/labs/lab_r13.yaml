lab_id: purple-agg-r13
title: "퍼플 집계 R13 — AI 레드팀 — 기계 속도의 체인"
version: purple-agg-1
course: purple-agg
week: 13
description: |
  R13 AI 레드팀 — 사람이 며칠 걸리는 체인을 3분에. 기계 속도는 '분 단위 집계'에서 튄다.

  Red(로그로만 재현) — 자율 에이전트(UA python-httpx), 표적 juiceshop → neobank·govportal·mediforum
    · D-30·D-16: 같은 인프라의 '예행 연습' 짧은 폭주 2회 (각 1분, 경로 대입만)
    · D-2 04:11~04:14 본 체인: 경로 대입 420건(52초) → SQLi 120건(차단 40·우회 80, 덤프 4)
      → 탈취 계정 로그인 → node 프로세스가 셸 12회(40초) → juiceshop 에서 서버 3대로 SSH(30초) → neobank 유출
  Blue: juice 분당 요청 폭주 → UA 분포 → IP 의 처음·마지막(초) → 분 단위 단계 전이 → SSH 전파 속도 → 경보 레벨

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "분당 요청 수(bucket_selector 250+)로 폭주 분을 찾는다"
  - "UA 분포와 IP 의 처음·마지막(초)으로 자율 에이전트를 특정한다"
  - "분 단위 단계 전이·SSH 전파 속도로 체인을 복원한다"
  - "ModSecurity 고정 창 속도 제한·Wazuh 짧은 timeframe 빈도·자동 차단의 의미를 확인한다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — juice.kt66.lab 분당 요청 — 250건 이상인 분
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. 정상 피크도 분당 수백 건이지만 '한 IP' 가 아니다 — 분 버킷 + 상위 IP.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r13_ai_redteam.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r13_ai_redteam.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r13_ai_redteam.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r13 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r13_ai_redteam.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r13/_search -d @- <<'EOF' | jq -r '.aggregations.m.buckets[] | "\(.key_as_string) | \(.doc_count)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"decoder.name":"web-accesslog"}},{"term":{"data.vhost":"juice.kt66.lab"}}]}},"aggs":{"m":{"date_histogram":{"field":"timestamp","fixed_interval":"1m","time_zone":"+09:00","format":"MM-dd HH:mm","min_doc_count":1},"aggs":{"hot":{"bucket_selector":{"buckets_path":{"c":"_count"},"script":"params.c >= 250"}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r13_ai_redteam.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Date Histogram `timestamp` 간격 1m → 조건 거르기(bucket_selector) — Visualize 에는 없음 → DSL·모니터로 · 필터 `decoder.name:"web-accesslog" and data.vhost:"juice.kt66.lab"`

      ## ✅ 합격 기준
      `10-30 04:11` 출력 시 통과.
