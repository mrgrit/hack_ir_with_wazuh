      python3 rules/common/purple_http_replay.py r13_http.jsonl --host 10.20.32.80

      # 11) 룰 id 별 차단 수
      docker exec kt66-web sh -c "grep -o 'id \"9[0-9]\{4\}\"' /var/log/apache2/purple_test_error.log | sort | uniq -c"

      # ── osquery (호스트) — 예약 쿼리 팩. 실제 공격이 없으니 결과 [] 가 정상 ──
