      docker exec kt66-ips mkdir -p /tmp/r13-out
      docker exec kt66-ips suricata -r /tmp/r13.pcap -S /tmp/r13.rules -k none -l /tmp/r13-out

      # 5) 규칙별 경보 수
      docker exec kt66-ips sh -c "grep -o '\[1:[0-9]*:1\] [^[]*' /tmp/r13-out/fast.log | sort | uniq -c"

      # ── ModSecurity (kt66-web) — 스텁 vhost purple-test.kt66.lab 에서만, 응답은 항상 "ok" ──
      # 6) 스텁 vhost 설치(최초 1회: R02 에서 했으면 건너뜀) — README §3
      # 7) 규칙 읽기 — id 913xx, phase·카운터(고정 창)
      cat rules/r13/modsec.conf

      # 8) 규칙 올리기 + 문법 검사 + 무중단 재적용
      docker cp rules/r13/modsec.conf kt66-web:/etc/modsecurity/purple/r13.conf
      docker exec kt66-web apache2ctl -t
      docker exec kt66-web apache2ctl -k graceful

      # 9) HTTP 재생 파일 만들기 (원래 출발지·상태코드·무해한 본문)
      python3 r13_ai_redteam.py http

