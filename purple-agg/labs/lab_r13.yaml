      ```bash
      # ── Suricata (kt66-ips) — 로그를 패킷으로 재구성해 오프라인 검사, 망에는 보내지 않는다 ──
      # 1) 규칙 읽기 — msg·threshold·sid 96130xx
      cat rules/r13/suricata.rules

      # 2) pcap 재구성 (공격 + 같은 시간대 정상 표본)
      python3 r13_ai_redteam.py pcap

      # 3) ips 컨테이너로 복사
      docker cp r13.pcap kt66-ips:/tmp/r13.pcap
      docker cp rules/r13/suricata.rules kt66-ips:/tmp/r13.rules

