      ## 🎯 목표 — 지속 탐지 — 모니터: 주입 패턴 표지 20회 이상인 사용자
      ## 📖 개념 한 줄
      한 번 찾은 집계는 모니터로 만든다. bucket_selector 로 '조건을 넘는 버킷'만 남기고, 버킷이 하나라도 있으면 트리거한다. Wazuh 상관 규칙은 분·시간 창의 기억이지만 모니터는 인덱스 전체(최대 1년)를 다시 센다 — 긴 창은 모니터의 몫이다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 모니터가 쓸 집계(+bucket_selector 조건)를 읽는다
      python3 r12_ai_service.py dsl MON

      # 2) 같은 집계를 지금 데이터에 — 조건을 넘는 버킷만 남는다
