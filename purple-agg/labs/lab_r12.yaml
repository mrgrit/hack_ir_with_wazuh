lab_id: purple-agg-r12
title: "퍼플 집계 R12 — AI 서비스 — 챗봇 로그의 이상치"
version: purple-agg-1
course: purple-agg
week: 12
description: |
  R12 AI 서비스 공격·방어 — 챗봇 로그에서 '평범한 사용자는 쓰지 않는 것'을 집계로 찾는다.

  Red(로그로만 재현) — 가입 사용자 u7731042, 표적 aicompanion(10.20.40.87)
    1) D-45~D-4: 프롬프트 인젝션 시도(긴 프롬프트·주입 패턴 표지) — 실제 로그 재방문 패턴
    2) 도구 남용: 일반 사용자에게 없는 http_fetch·file_read·shell 호출 → http_fetch 로 내부 관리콘솔 SSRF
    3) /api/debug/* 로 시스템 프롬프트·설정 노출 시도(404 → 200), RAG 문서 업로드로 오염
  Blue: 도구 분포 → 관리 도구 사용자 → 사용자별 프롬프트 길이 → 표지×차단 → 디버그·업로드 경로 → 동서 연결

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "도구 호출 분포와 관리 도구 사용자를 집계로 찾는다"
  - "사용자별 최대·평균 프롬프트 길이로 주입 시도자를 찾는다"
  - "주입 표지×차단 여부, 디버그·업로드 경로, AI 서버의 동서 연결을 확인한다"
  - "ModSecurity(디버그 숨김·주입 문구·RAG 업로드)·Wazuh JSON 필드 규칙·Sigma 로 자동화한다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — 챗봇 도구 호출 분포
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. 도구 호출의 대부분은 none·search — http_fetch·shell 은 일반 사용자에게 없다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r12_ai_service.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r12_ai_service.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r12_ai_service.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r12 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r12_ai_service.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r12/_search -d @- <<'EOF' | jq -r '.aggregations.tool.buckets[] | "\(.key) | \(.doc_count)"'
      {"size":0,"query":{"exists":{"field":"data.ai.tool"}},"aggs":{"tool":{"terms":{"field":"data.ai.tool","size":8}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r12_ai_service.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `data.ai.tool` size 8 · 필터 `data.ai.tool:*`

      ## ✅ 합격 기준
      `none` 출력 시 통과.
