      docker exec kt66-siem /var/ossec/bin/wazuh-analysisd -t

      # 5) 재시작
      docker exec kt66-siem /var/ossec/bin/wazuh-control restart

      # 6) 재생 파일 만들기 (공격 + 같은 시간대 정상 표본, 원래 시각 포함)
      python3 r12_ai_service.py replay

      # 7) manager 로 복사 → 시간 간격을 지켜 흘려 넣기 (상관 규칙은 '도착 시각'으로 센다)
      docker cp r12_replay.jsonl kt66-siem:/tmp/
      docker cp rules/common/purple_log_replay.py kt66-siem:/tmp/
      docker exec kt66-siem /var/ossec/framework/python/bin/python3 /tmp/purple_log_replay.py /tmp/r12_replay.jsonl --dry
      docker exec kt66-siem /var/ossec/framework/python/bin/python3 /tmp/purple_log_replay.py /tmp/r12_replay.jsonl

      # 8) 규칙별 경보 수 — 단건과 상관 규칙이 각각 몇 번 울렸나
      docker exec kt66-siem sh -c "grep -oE 'Rule: 1912[0-9]+ \(level [0-9]+\)' /var/ossec/logs/alerts/alerts.log | sort | uniq -c"

      # 9) Sigma — kt66 변환기(단건) → 부모 연결(--fix-parents) → 상관 변환
      cp rules/r12/sigma/*.yml ~/kt66/sigma/rules/
      python3 ~/kt66/sigma/sigma2wazuh.py ~/kt66/sigma/rules > /tmp/sigma_rules.xml
