lab_id: purple-agg-r09
title: "퍼플 집계 R09 — 중간 종합 — 석 달짜리 체인"
version: purple-agg-1
course: purple-agg
week: 9
description: |
  R09 중간 종합 — 석 달에 걸친 사람 속도의 전체 체인 (R02~R08 기법 결합, 무예고)

  Red(로그로만 재현) — 표적 govportal(10.20.40.84) → neobank·mediforum
    ① D-85~D-40 정찰(재방문 패턴)  ② D-35 SQLi: 차단→우회→덤프  ③ D-34 밤 웹셸 업로드·명령
    ④ D-33 권한상승(sudo 오용)·계정 생성·cron  ⑤ D-20 shadow 열람 → govportal 에서 neobank·mediforum 으로 SSH
    ⑥ D-5 neobank → 외부 대용량 전송  ⑦ D-4 로그 삭제
  Blue: R03·R04·R05·R07·R08 의 집계를 한 인덱스에서 다시 쓰고, 날짜순으로 이어 붙여 체인을 복원한다.

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "앞 라운드 집계 5개를 골라 같은 인덱스에 적용한다(차단→통과, apache2→sh, 비관리자 sudo, 서버발 SSH, 업로드 합계)"
  - "체인 단계마다 '처음 본 날'을 집계로 확정해 타임라인을 만든다"
  - "Wazuh 단계 규칙(분·시간)과 장기 연결(모니터·집계)의 역할을 나눈다"
  - "중간 보고서(체인·근거 쿼리·놓친 단계)를 쓴다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — 차단 20회+ · 통과 20회+ 를 함께 가진 외부 IP (R03 기법)
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. R03 기법 — 같은 IP 의 차단 20+ · 통과 20+.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r09_midterm.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r09_midterm.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r09_midterm.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r09 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r09_midterm.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r09/_search -d @- <<'EOF' | jq -r '.aggregations.by_ip.buckets[] | "\(.key) | \(.blocked.doc_count) | \(.ok.doc_count) | \(.mx.value)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"decoder.name":"web-accesslog"}}],"must_not":[{"prefix":{"data.srcip":"10."}}]}},"aggs":{"by_ip":{"terms":{"field":"data.srcip","size":100,"order":{"blocked>_count":"desc"}},"aggs":{"blocked":{"filter":{"term":{"data.id":"403"}}},"ok":{"filter":{"term":{"data.id":"200"}}},"mx":{"max":{"field":"data.bytes"}},"hit":{"bucket_selector":{"buckets_path":{"b":"blocked>_count","o":"ok>_count"},"script":"params.b >= 20 && params.o >= 20"}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r09_midterm.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `data.srcip` size 100 · 정렬 blocked>_count desc → (하위 필터: data.id:"403") → (하위 필터: data.id:"200") → Metric: Max `data.bytes` → 조건 거르기(bucket_selector) — Visualize 에는 없음 → DSL·모니터로 · 필터 `decoder.name:"web-accesslog" and not data.srcip:10.*`

      ## ✅ 합격 기준
      `208.162.131.213` 출력 시 통과.
