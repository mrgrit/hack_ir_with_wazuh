lab_id: purple-agg-r04
title: "퍼플 집계 R04 — 실행·지속성 — 수천 건 속 한 건"
version: purple-agg-1
course: purple-agg
week: 4
description: |
  R04 실행·지속성 — 업로드 이미지 수천 장 속 PHP 한 개, cron 실행 수만 건 속 /tmp 스크립트 하나.

  Red(로그로만 재현) — 공격자 W, 표적 mediforum(10.20.40.85)
    1) 이미지로 위장한 웹셸 업로드(FIM 554) → 2) 웹셸로 명령 실행(웹 GET + auditd: apache2 → sh)
    3) 지속성: 계정 생성(5902)·/etc/passwd·shadow 변경·cron.d 추가·root authorized_keys·rc.local
    4) cron 이 10분마다 /tmp/.x/update.sh 실행 (auditd)
  Blue: 업로드 FIM 확장자 분포 → 부모-자식 프로세스 쌍 → 업로드 경로 PHP 호출 IP → /etc·/root 변경 → 주기 실행 → 타임라인

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "FIM 554(추가)를 확장자별로 집계해 업로드 폴더의 스크립트를 찾는다"
  - "auditd 부모×실행 파일 쌍 집계로 '웹서버가 셸을 띄운' 드문 쌍을 찾는다"
  - "웹셸 호출 IP 의 주별 접근으로 장기 잠복을 확인한다"
  - "ModSecurity(업로드·실행 차단)·Wazuh(웹셸→계정 생성 순서)·osquery·Sysmon 규칙으로 자동화한다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — 파일 추가(FIM 554) — 업로드 폴더 확장자별
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. 업로드 폴더에는 이미지가 쌓인다 — 확장자 분포에서 .php 한 줄이 튄다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r04_persistence.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r04_persistence.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r04_persistence.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r04 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r04_persistence.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r04/_search -d @- <<'EOF' | jq -r '.aggregations.ext.buckets | to_entries[] | {key} + .value | "\(.key) | \(.doc_count)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"rule.id":"554"}},{"wildcard":{"syscheck.path":"/var/www/*/uploads/*"}}]}},"aggs":{"ext":{"filters":{"filters":{"1_jpg":{"wildcard":{"syscheck.path":"*.jpg"}},"2_png":{"wildcard":{"syscheck.path":"*.png"}},"3_pdf":{"wildcard":{"syscheck.path":"*.pdf"}},"4_php":{"wildcard":{"syscheck.path":"*.php"}}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r04_persistence.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Filters (1_jpg / 2_png / 3_pdf / 4_php) · 필터 `rule.id:"554" and syscheck.path:/var/www/*/uploads/*`

      ## ✅ 합격 기준
      `1_jpg` 출력 시 통과.
