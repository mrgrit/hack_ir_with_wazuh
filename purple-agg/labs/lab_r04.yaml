      docker cp rules/r04/wazuh_ar.xml kt66-siem:/tmp/r04_ar.xml
      docker exec kt66-siem sh -c "{ echo '<ossec_config>'; cat /tmp/r04_ar.xml; echo '</ossec_config>'; } >> /var/ossec/etc/ossec.conf"
      docker exec kt66-siem /var/ossec/bin/wazuh-control restart

