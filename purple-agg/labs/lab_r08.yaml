lab_id: purple-agg-r08
title: "퍼플 집계 R08 — C2·유출 — 규칙성과 볼륨"
version: purple-agg-1
course: purple-agg
week: 8
description: |
  R08 C2·유출 — 석 달 내내 한 시간마다 같은 곳, 이름이 긴 DNS 질의 수백 개, 새벽의 대용량 업로드.

  Red(로그로만 재현) — 감염 PC KT66-WIN-01(10.20.70.10)
    1) HTTPS 비콘: D-80 부터 1시간(±25%) 간격 — 사용자가 없는 밤·주말에도
    2) 비표준 포트 백업 채널 8443: 실제 로그 재방문 패턴으로 드문드문
    3) DNS 터널: 서브도메인에 데이터를 실은 TXT 질의 — 세 번의 새벽(실제 로그 시간대 분포)
    4) 유출: D-1 새벽 파일 공유 서비스로 300~800MB 업로드 6회
  Blue: 내부 출발지별 흐름 → 감염 PC 목적지 → 일별·시간대 규칙성 → 도메인별 서브도메인 수 → 업로드 합계 → 포트 분포

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "감염 PC 의 목적지를 활동 일수·포트로 줄 세워 비콘 목적지를 찾는다"
  - "6시간 버킷으로 밤·주말에도 일정한 연결(사람이 아닌 프로그램)을 확인한다"
  - "도메인별 서로 다른 질의 이름 수·평균 길이로 DNS 터널을 찾는다"
  - "bytes_toserver 합계로 유출 목적지를 찾고 Suricata·Wazuh·Sysmon·모니터로 자동화한다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — 사용자존(10.20.70.x) 출발지별 외부 연결 수 (상위 5)
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. 사용자존 출발지별 외부 연결 수 — 감염 PC 가 꼭 1위는 아니다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r08_c2_exfil.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r08_c2_exfil.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r08_c2_exfil.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r08 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r08_c2_exfil.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r08/_search -d @- <<'EOF' | jq -r '.aggregations.src.buckets[] | "\(.key) | \(.doc_count)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"data.event_type":"flow"}},{"prefix":{"data.src_ip":"10.20.70."}}]}},"aggs":{"src":{"terms":{"field":"data.src_ip","size":5}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r08_c2_exfil.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `data.src_ip` size 5 · 필터 `data.event_type:"flow" and data.src_ip:10.20.70.*`

      ## ✅ 합격 기준
      `10.20.70.10` 출력 시 통과.
