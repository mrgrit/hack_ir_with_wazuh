      - Sysmon: `rules/r08/sysmon.xml` 의 RuleGroup 을 Sysmon 설정(Windows `sysmon64 -c`, Linux `sysmon -c`)에 합친다 — kt66 에 Sysmon 이 없으면 추가 설치 제안(README §6).
      - 검증 해석: 9608003(stream_size 100MB)은 pcap 재구성이 흐름을 1,400바이트로 줄이므로 0 — 업로드는 미션 3~4 의 bytes_toserver 합계(Q5)로 본다.

