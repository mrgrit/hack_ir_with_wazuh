      **실습 위치:** `kt66 호스트` (`cd ~/purple-agg`) — `docker cp`/`docker exec` 로 kt66-ips·kt66-web 에 적용

      ```bash
      # ── Suricata (kt66-ips) — 로그를 패킷으로 재구성해 오프라인 검사, 망에는 보내지 않는다 ──
      # 1) 규칙 읽기 — msg·threshold·sid 96080xx
      cat rules/r08/suricata.rules

      # 2) pcap 재구성 (공격 + 같은 시간대 정상 표본)
      python3 r08_c2_exfil.py pcap

      # 3) ips 컨테이너로 복사
      docker cp r08.pcap kt66-ips:/tmp/r08.pcap
      docker cp rules/r08/suricata.rules kt66-ips:/tmp/r08.rules

      # 4) 오프라인 검사 — -S 로 이 규칙만 (운영 룰셋과 섞지 않음)
      docker exec kt66-ips mkdir -p /tmp/r08-out
      docker exec kt66-ips suricata -r /tmp/r08.pcap -S /tmp/r08.rules -k none -l /tmp/r08-out

      # 5) 규칙별 경보 수
      docker exec kt66-ips sh -c "grep -o '\[1:[0-9]*:1\] [^[]*' /tmp/r08-out/fast.log | sort | uniq -c"

      # ── osquery (호스트) — 예약 쿼리 팩. 실제 공격이 없으니 결과 [] 가 정상 ──
      # 6) 쿼리 팩 읽기
      cat rules/r08/osquery.conf

      # 7) 대표 쿼리를 즉석 실행 (kt66-web) — R08: 비표준 포트 외부 연결 프로세스 (Windows/Linux 공용)
      docker exec kt66-web osqueryi --json "SELECT p.name, p.path, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p USING(pid) WHERE s.remote_port IN (8443, 4444, 8888) AND s.remote_address NOT LIKE '10.%';"
      ```
      - Suricata: threshold 는 '서명 한 줄'의 집계다. 분산·장기 패턴은 서명으로 안 잡히는 것이 정상 — 미션 2~5 의 집계와 비교한다.
