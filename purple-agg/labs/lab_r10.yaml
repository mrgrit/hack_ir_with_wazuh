      field: stdout
      semantic:
        intent: "적재 + 정상 기준선"
        success_criteria: ["인덱스 purple-r10", "Q0 건수", "Q1 분포"]
        acceptable_methods: ["**[OSS] OpenSearch 집계 DSL + Dashboard (권장)**"]
    target_vm: host

