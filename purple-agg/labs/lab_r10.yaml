      docker exec kt66-ips suricata -r /tmp/r10.pcap -S /tmp/r10.rules -k none -l /tmp/r10-out

      # 5) 규칙별 경보 수
      docker exec kt66-ips sh -c "grep -o '\[1:[0-9]*:1\] [^[]*' /tmp/r10-out/fast.log | sort | uniq -c"

      # ── osquery (호스트) — 예약 쿼리 팩. 실제 공격이 없으니 결과 [] 가 정상 ──
