lab_id: purple-agg-r10
title: "퍼플 집계 R10 — 영향 — 공격인가 장애인가"
version: purple-agg-1
course: purple-agg
week: 10
description: |
  R10 영향(AI 데이터센터) — 몇 분 사이 수천 건의 파일 변경, 두 달 내내 같은 포트, 그리고 '공격이 아닌' 장애.

  Red(로그로만 재현)
    1) 크립토마이닝: GPU 존(10.20.50.60) → 풀 서버 3333/tcp(stratum), D-60 부터 낮에는 쉬고 밤에만(시간대 프로파일)
    2) 웹 변조: D-1 08:57 mediforum 첫 화면 교체 → 이후 '/' 응답 크기 급감
    3) 랜섬 준비: D-2 03:00 govportal 공유폴더 1,200개 파일 암호화(.kt66lock 추가·원본 삭제) + 안내문 30개
    (정상) 장애 주입: D-3 14:00~14:25 neobank 백엔드 장애 → 503 급증 (공격 아님)
  Blue: FIM 폭주 구간 → 패턴별 파일 → vhost 별 5xx 폭주 → '/' 평균 크기 → GPU 존 포트 → 서버별 FIM·5xx 판별표

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "FIM 10분 버킷(bucket_selector 200+)으로 대량 변경 구간과 호스트를 찾는다"
  - "vhost 별 5xx 폭주 구간을 찾고 FIM 과 함께 놓아 공격·장애를 판별한다"
  - "첫 화면 평균 응답 크기 변화로 웹 변조를 확인한다"
  - "GPU 존 포트·지속시간 집계로 마이닝을 찾고, 랜섬 FIM 빈도 규칙·Sysmon FileCreate 로 자동화한다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — FIM 이벤트 10분 버킷 — 200건 이상만, 호스트별
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. FIM 은 평소 시간당 몇 건 — 10분에 200건+ 이면 대량 변경이다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r10_impact.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r10_impact.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r10_impact.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r10 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r10_impact.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r10/_search -d @- <<'EOF' | jq -r '.aggregations.t.buckets[] | .key_as_string as $k | .ag.buckets[] | "\($k) | \(.key) | \(.doc_count)"'
      {"size":0,"query":{"prefix":{"decoder.name":"syscheck"}},"aggs":{"t":{"date_histogram":{"field":"timestamp","fixed_interval":"10m","time_zone":"+09:00","format":"MM-dd HH:mm","min_doc_count":1},"aggs":{"ag":{"terms":{"field":"agent.name","size":2}},"burst":{"bucket_selector":{"buckets_path":{"c":"_count"},"script":"params.c >= 200"}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r10_impact.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Date Histogram `timestamp` 간격 10m → Split rows: Terms `agent.name` size 2 → 조건 거르기(bucket_selector) — Visualize 에는 없음 → DSL·모니터로 · 필터 `decoder.name:syscheck*`

      ## ✅ 합격 기준
      `10-30 03:00` 출력 시 통과.
    hint: "gen → ask Q0 → Q1"
    category: survey
    points: 10
    answer: |2
      # 1) 생성·적재 (기준일 고정)
      python3 r10_impact.py gen --anchor 2026-11-01 >/dev/null && python3 r10_impact.py ask Q0
      # 2) 정상의 모양
      python3 r10_impact.py ask Q1
    answer_detail: "총 2,440,763건 · 공격 3,023건 · 정상(배경 포함) 99.876% — 정상이 99.9% 인 데이터에서 '정상의 모양'을 먼저 기록한다. FIM 은 평소 시간당 몇 건 — 10분에 200건+ 이면 대량 변경이다."
    expected_output: |2
      # Q0
      2440763 | 1048816
      # Q1
      10-30 03:00 | govportal | 1995
      10-30 03:10 | govportal | 435
    verify:
