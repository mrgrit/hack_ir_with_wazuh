      cat rules/r15/wazuh_ar.xml

      # 2) ossec.conf 에 추가 (purple-ar 명령·스크립트는 최초 1회 — README §4)
      docker cp rules/r15/wazuh_ar.xml kt66-siem:/tmp/r15_ar.xml
      docker exec kt66-siem sh -c "{ echo '<ossec_config>'; cat /tmp/r15_ar.xml; echo '</ossec_config>'; } >> /var/ossec/etc/ossec.conf"
      docker exec kt66-siem /var/ossec/bin/wazuh-control restart

      # 3) 재생을 한 번 더 → 대응 기록 확인 (purple-ar 은 '무엇을 했어야 하는지'만 적는다)
