lab_id: purple-agg-r15
title: "퍼플 집계 R15 — 최종 — 혼합 체인과 미끼"
version: purple-agg-1
course: purple-agg
week: 15
description: |
  R15 최종 — 사람의 느린 체인 + AI 의 빠른 체인 + 허가된 점검·정상 백업이라는 '미끼'.

  Red(로그로만 재현)
    사람(두 달): D-60 피싱 → park.jiwoo PC(WINWORD → powershell) → 30분±6분 HTTPS 비콘
                → D-21 그 PC 에서 관리자 계정으로 관리콘솔 SSH → D-9·D-3 DNS 터널
    AI(3분): D-1 03:00 챗봇 프롬프트 인젝션 → http_fetch 로 관리콘솔 내부 API(사용자 내보내기) SSRF → 외부 전송
    미끼: ① 허가된 외부 점검업체(D-14, govportal 경로 대입) ② neobank 매일 01시 백업 업로드(정상)
  Blue: 지금까지의 집계 기법을 골라 쓰고, 미끼(허용 목록)를 근거와 함께 제외한다.

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "부모×자식 드문 쌍·외부 목적지 활동 일수로 사람 체인(피싱→비콘)을 찾는다"
  - "bastion 이 아닌 SSH·DNS 서브도메인 수·관리콘솔 응답 MB 로 나머지 단계를 찾는다"
  - "매일 반복 업로드(정상 백업)·허가된 점검 IP 를 허용 목록(CDB·ModSec ctl·Suricata pass)으로 근거와 함께 제외한다"
  - "최종 보고서: 탐지 체인·제외 근거·규칙 팩·놓친 단계"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — KT66-WIN-01 프로세스 생성 — 부모 × 자식 (드문 쌍)
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. Windows 프로세스 부모×자식 — WINWORD→powershell 은 정상 PC 에 없다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r15_final.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r15_final.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r15_final.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r15 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r15_final.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r15/_search -d @- <<'EOF' | jq -r '.aggregations.p.buckets[] | .key as $k | .c.buckets[] | "\($k) | \(.key) | \(.doc_count)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"agent.name":"KT66-WIN-01"}},{"term":{"data.win.system.eventID":"4688"}}]}},"aggs":{"p":{"terms":{"field":"data.win.eventdata.parentProcessName","size":4,"order":{"_count":"asc"}},"aggs":{"c":{"terms":{"field":"data.win.eventdata.newProcessName","size":2}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r15_final.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `data.win.eventdata.parentProcessName` size 4 · 정렬 _count asc → Split rows: Terms `data.win.eventdata.newProcessName` size 2 · 필터 `agent.name:"KT66-WIN-01" and data.win.system.eventID:"4688"`

      ## ✅ 합격 기준
      `C:\Program Files\Microsoft Office\WINWOR` 출력 시 통과.
    hint: "gen → ask Q0 → Q1"
    category: survey
    points: 10
    answer: |2
      # 1) 생성·적재 (기준일 고정)
      python3 r15_final.py gen --anchor 2026-11-01 >/dev/null && python3 r15_final.py ask Q0
      # 2) 정상의 모양
      python3 r15_final.py ask Q1
    answer_detail: "총 2,467,369건 · 공격 3,906건 · 정상(배경 포함) 99.842% — 정상이 99.9% 인 데이터에서 '정상의 모양'을 먼저 기록한다. Windows 프로세스 부모×자식 — WINWORD→powershell 은 정상 PC 에 없다."
    expected_output: |2
