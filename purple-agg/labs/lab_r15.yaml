      {"size":0,"query":{"bool":{"filter":[{"term":{"rule.id":"5715"}},{"prefix":{"data.srcip":"10."}}],"must_not":[{"term":{"data.srcip":"10.20.30.201"}},{"term":{"agent.name":"bastion"}}]}},"aggs":{"src":{"terms":{"field":"data.srcip","size":5},"aggs":{"t":{"terms":{"field":"agent.name","size":2}},"u":{"terms":{"field":"data.srcuser","size":1}}}}}}
      EOF

      # 6) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r15_final.py ask Q3
      ```
      - Q2 시각화: Split rows: Terms `data.dest_ip` size 3 → Split rows: Date Histogram `timestamp` 간격 1d → Metric: Sum `data.flow.bytes_toserver` · 필터 `data.event_type:"flow" and data.src_ip:"10.20.70.10"`
      - Q3 시각화: Split rows: Terms `data.srcip` size 5 → Split rows: Terms `agent.name` size 2 → Split rows: Terms `data.srcuser` size 1 · 필터 `rule.id:"5715" and data.srcip:10.* and not data.srcip:"10.20.30.201" and not agent.name:"bastion"`

