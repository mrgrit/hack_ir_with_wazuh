      {"size":0,"query":{"bool":{"filter":[{"term":{"data.event_type":"flow"}},{"term":{"data.src_ip":"10.20.70.10"}}]}},"aggs":{"d":{"terms":{"field":"data.dest_ip","size":3},"aggs":{"days":{"date_histogram":{"field":"timestamp","fixed_interval":"1d","time_zone":"+09:00","min_doc_count":1}},"up":{"sum":{"field":"data.flow.bytes_toserver"}}}}}}
