lab_id: purple-agg-r01
title: "퍼플 집계 R01 — 가시성 베이스라인 — 정상의 모양과 서버발 비콘"
version: purple-agg-1
course: purple-agg
week: 1
description: |
  R01 운영체제 수립 + 가시성 베이스라인 — 정상의 모양을 집계로 재고, 그 위에서 튀는 것을 본다.

  Red(로그로만 재현): juiceshop 서버(10.20.40.81)에 심긴 Caldera sandcat 이 C2 로 30~60초마다 POST /beat.
                     Discovery 명령(whoami·pwd·ls·ifconfig·which)은 로그가 남지 않는다(가시성 0).
  Blue: 엔드포인트별 정상 분포 → 서버발 외부 목적지 집계 → 시간 규칙성 → 모니터.

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "엔드포인트(가상 IP)별 정상 분포를 Terms·Cardinality 집계로 기록한다"
  - "서버존(10.20.40.x)발 외부 목적지를 '출발지 수 × 활동 일수'로 줄 세워 비콘 후보를 고른다"
  - "일 단위 Date Histogram 으로 75일 잠복 + 하루의 대화형 폭주를 구분한다"
  - "Suricata·Wazuh·Sigma 규칙과 Alerting 모니터로 같은 판단을 자동화한다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — 이벤트 출처(에이전트)별 분포 — 정상의 모양 ①
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. 어느 센서가 얼마나 말하는지부터 본다 — 정상의 크기를 모르면 이상의 크기도 모른다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r01_baseline.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r01_baseline.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r01_baseline.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r01 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r01_baseline.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r01/_search -d @- <<'EOF' | jq -r '.aggregations.by_agent.buckets[] | "\(.key) | \(.doc_count)"'
      {"size":0,"aggs":{"by_agent":{"terms":{"field":"agent.name","size":15}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r01_baseline.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `agent.name` size 15

      ## ✅ 합격 기준
      `juiceshop` 출력 시 통과.
