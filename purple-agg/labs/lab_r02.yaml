      # 2) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r02/_search -d @- <<'EOF' | jq -r '.aggregations.by_ip.buckets[] | "\(.key) | \(.doc_count)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"decoder.name":"web-accesslog"}},{"term":{"data.id":"404"}}]}},"aggs":{"by_ip":{"terms":{"field":"data.srcip","size":5}}}}
      EOF

      # 3) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r02_recon.py ask Q2

      # ── Q3 404 IP 별 서로 다른 URL 수·vhost 수 (고유 URL 순) ──
      # 4) Q3 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r02_recon.py dsl Q3

      # 5) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r02/_search -d @- <<'EOF' | jq -r '.aggregations.by_ip.buckets[] | "\(.key) | \(.doc_count) | \(.urls.value) | \(.hosts.value)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"decoder.name":"web-accesslog"}},{"term":{"data.id":"404"}}]}},"aggs":{"by_ip":{"terms":{"field":"data.srcip","size":5,"order":{"urls":"desc"}},"aggs":{"urls":{"cardinality":{"field":"data.url"}},"hosts":{"cardinality":{"field":"data.vhost"}}}}}}
      EOF

      # 6) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r02_recon.py ask Q3

      # ── Q4 neobank API(/api/) 404 — 경로별 서로 다른 IP 수 ──
      # 7) Q4 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r02_recon.py dsl Q4

      # 8) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r02/_search -d @- <<'EOF' | jq -r '.aggregations.by_url.buckets[] | "\(.key) | \(.doc_count) | \(.ips.value)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"decoder.name":"web-accesslog"}},{"term":{"data.vhost":"neobank.kt66.lab"}},{"term":{"data.id":"404"}},{"prefix":{"data.url":"/api/"}}]}},"aggs":{"by_url":{"terms":{"field":"data.url","size":5,"order":{"ips":"desc"}},"aggs":{"ips":{"cardinality":{"field":"data.srcip"}}}}}}
      EOF

      # 9) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r02_recon.py ask Q4
      ```
      - Q2 시각화: Split rows: Terms `data.srcip` size 5 · 필터 `decoder.name:"web-accesslog" and data.id:"404"`
      - Q3 시각화: Split rows: Terms `data.srcip` size 5 · 정렬 urls desc → Metric: Unique Count `data.url` → Metric: Unique Count `data.vhost` · 필터 `decoder.name:"web-accesslog" and data.id:"404"`
      - Q4 시각화: Split rows: Terms `data.url` size 5 · 정렬 ips desc → Metric: Unique Count `data.srcip` · 필터 `decoder.name:"web-accesslog" and data.vhost:"neobank.kt66.lab" and data.id:"404" and data.url:/api/*`

      ## ✅ 합격 기준
      `/api/v1/admin/users` 출력 시 통과.
