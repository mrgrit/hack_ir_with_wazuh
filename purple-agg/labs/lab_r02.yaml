  - order: 2
    instruction: |2
      ## 🎯 목표 — 404 응답을 가장 많이 받은 IP 상위 5 · 404 IP 별 서로 다른 URL 수·vhost 수 (고유 URL 순) · neobank API(/api/) 404
      ## 📖 개념 한 줄
      **Q2** 404 는 '없는 것을 찾았다'는 뜻 — 404 상위가 첫 번째 거름망이다.
      **Q3** 고유 URL 수가 수백인 IP 는 사람이 아니다. 404 건수보다 cardinality 가 정찰을 가른다.
      **Q4** 같은 숨은 경로를 서로 다른 IP 수백 곳이 한두 번씩 — IP 별 집계로는 안 보이고 경로별 집계로만 보인다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # ── Q2 404 응답을 가장 많이 받은 IP 상위 5 ──
      # 1) Q2 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
