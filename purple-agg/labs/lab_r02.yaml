lab_id: purple-agg-r02
title: "퍼플 집계 R02 — 정찰·탐색 — 넓게 훑는 IP 찾기"
version: purple-agg-1
course: purple-agg
week: 2
description: |
  R02 정찰·탐색 — 많이 온 IP 가 아니라 '이상하게 넓게 훑은' IP 를 찾는다.

  Red(로그로만 재현)
    A: 외부 포트 스캔 — 공개 VIP 8개 × 상위 100포트 (FW DROP + IDS)
    B: 웹 콘텐츠 탐색 — govportal·mediforum 에 경로 사전 대입(평범한 브라우저 UA 로 위장)
    C: 분산 저속 정찰 — 300개 IP 가 neobank API 의 숨은 경로 2개를 1~2번씩
  Blue: 요청량 상위(정상 대량 이용자) → 404 상위 → IP별 고유 URL → 경로별 고유 IP → 포트 다양성

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "요청 수 상위와 404 상위가 다르다는 것을 집계로 확인한다"
  - "IP 별 고유 URL·vhost 수(cardinality)로 경로 대입을, 고유 포트 수로 포트 스캔을 찾는다"
  - "숨은 API 를 두드린 서로 다른 IP 수로 '분산 저속 정찰'을 찾는다"
  - "Suricata threshold·ModSecurity IP 카운터·Wazuh different_srcip 상관으로 자동화하고 한계를 비교한다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — 웹 요청 수 상위 10 IP — 많이 온 IP 는 누구인가
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. 요청 수 1위는 대개 정상 대량 사용자(NAT·봇)다 — '많이'는 정찰의 신호가 아니다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r02_recon.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r02_recon.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r02_recon.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r02 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r02_recon.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r02/_search -d @- <<'EOF' | jq -r '.aggregations.by_ip.buckets[] | .key as $k | .ua.buckets[] | "\($k) | \(.key) | \(.doc_count)"'
      {"size":0,"query":{"term":{"decoder.name":"web-accesslog"}},"aggs":{"by_ip":{"terms":{"field":"data.srcip","size":10},"aggs":{"ua":{"terms":{"field":"data.user_agent","size":1}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r02_recon.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `data.srcip` size 10 → Split rows: Terms `data.user_agent` size 1 · 필터 `decoder.name:"web-accesslog"`

      ## ✅ 합격 기준
      `196.112.185.106` 출력 시 통과.
    hint: "gen → ask Q0 → Q1"
    category: survey
    points: 10
