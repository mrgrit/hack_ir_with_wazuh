      190302(차단→통과) 발생 시 그 IP 를 즉시 차단(firewall-drop 30분)하고, 통과한 우회 패턴을 ModSec 90301·90302 로 막는다. 덤프된 기간의 /api/history 응답은 유출 범위 산정에 쓴다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` (`cd ~/purple-agg`)

      ```bash
      # 1) 이 라운드의 액티브 리스폰스 — 어떤 규칙에 무엇을 거나
      cat rules/r03/wazuh_ar.xml

      # 2) ossec.conf 에 추가 (purple-ar 명령·스크립트는 최초 1회 — README §4)
      docker cp rules/r03/wazuh_ar.xml kt66-siem:/tmp/r03_ar.xml
      docker exec kt66-siem sh -c "{ echo '<ossec_config>'; cat /tmp/r03_ar.xml; echo '</ossec_config>'; } >> /var/ossec/etc/ossec.conf"
      docker exec kt66-siem /var/ossec/bin/wazuh-control restart

      # 3) 재생을 한 번 더 → 대응 기록 확인 (purple-ar 은 '무엇을 했어야 하는지'만 적는다)
      docker exec kt66-siem /var/ossec/framework/python/bin/python3 /tmp/purple_log_replay.py /tmp/r03_replay.jsonl
      docker exec kt66-siem tail -5 /var/ossec/logs/purple-ar.log

      # 5) 라운드 카드 — 집계 숫자는 미션 1~5 의 출력에서 옮긴다
      cat > ~/purple-agg/r03_card.md <<'EOF'
      # PURPLE-AGG R03 라운드 카드 — 초기 침투(웹) — 차단 뒤 통과로 바뀐 IP
      ## 1. 질문: 차단(403)이 반복되던 IP 가 어느 순간 통과(200)로 바뀐다 — 같은 IP 의 응답 코드 구성비로 WAF 우회를 찾는다
      ## 2. 데이터: 총 2,442,618건 · 공격 1,490건 · 정상(배경 포함) 99.939%
      ## 3. 집계 결과(첫 줄)
      - Q1 WAF 차단 상위 IP 와 대상 vhost: 218.136.73.91 | neobank.kt66.lab | 516
      - Q2 neobank: 218.136.73.91 | 974 | 516 | 362 | 24
      - Q3 neobank /api/history: 218.136.73.91 | 886 | 5189279 | 85516 | 72
      - Q4 WAF 를 통과한 요청의 우회 흔적: 2_double_enc | 60
      - Q5 neobank 500 응답 상위 IP: 218.136.73.91 | 24
      - Q6 공격 IP 218.136.73.91 의 10분 단위 응답 코드 흐름 (본 공격일): 08-24 07:00 | 403 | 1
      - Q7 공격 IP 218.136.73.91: 218.136.73.91 | 974 | 4 | 2026-08-24 | 2026-10-28
      ## 4. 규칙: Suricata 96030xx · ModSec 903xx · Wazuh 19030x · Sigma purple-r03-*
      ## 5. 대응: 190302(차단→통과) 발생 시 그 IP 를 즉시 차단(firewall-drop 30분)하고, 통과한 우회 패턴을 ModSec 90301·90302 로 막는다. 덤프된 기간의 /api/history 응답은 유출 범위 산정에 쓴다.
      ## 6. 놓친 것·다음 라운드: (직접 적는다)
      EOF

      # 6) 카드 확인
      cat ~/purple-agg/r03_card.md
      ```
      - 대응 대상 규칙: 190301, 190302
      - 재생 IP 는 가상(198.51.100.x·무작위 공인 대역)이다 — 위협 인텔로 공유하지 않는다.
      - Dashboard: 미션 2~5 의 시각화를 하나의 Dashboard 로 묶어 스크린샷을 카드에 붙인다. ![스크린샷: r03 대시보드](images/r03-dashboard.png)

