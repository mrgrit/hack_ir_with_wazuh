lab_id: purple-agg-r03
title: "퍼플 집계 R03 — 초기 침투(웹) — 차단 뒤 통과로 바뀐 IP"
version: purple-agg-1
course: purple-agg
week: 3
description: |
  R03 초기 침투(웹) — WAF 에 막히다가 어느 순간 '통과하기 시작한' IP 를 집계로 잡는다.

  Red(로그로만 재현) — 공격자 X, 표적 neobank(10.20.40.83)
    1) 경로 탐색(소량) → 2) /api/history?page= 에 SQLi 대입 — WAF 차단(403)
    3) 인코딩·주석·대소문자 섞기로 우회 — 200·500 응답  4) UNION 덤프 — 응답 크기 수 MB
  Blue: WAF 차단 상위(교육용 DVWA 소음 구분) → 같은 IP 의 차단·통과 동시 존재 → 응답 크기 이상 → 우회 패턴 → 500 → 타임라인

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "WAF 차단 상위 IP 와 대상 vhost 를 집계한다"
  - "filters 집계로 같은 IP 의 403·200·500 을 한 줄에 놓고 '차단 뒤 통과'를 찾는다"
  - "응답 크기(max·avg)로 덤프(대량 유출) 요청을 구분한다"
  - "우회 패턴(/**/·%2527·대소문자)을 Suricata·ModSecurity 로 보강하고 Wazuh 순서 상관(차단→통과)을 만든다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — WAF 차단 상위 IP 와 대상 vhost
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. WAF 가 막은 것부터 — 차단이 많은 IP 는 '시도한' IP 다.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r03_webexploit.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r03_webexploit.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r03_webexploit.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r03 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r03_webexploit.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r03/_search -d @- <<'EOF' | jq -r '.aggregations.by_ip.buckets[] | .key as $k | .vh.buckets[] | "\($k) | \(.key) | \(.doc_count)"'
      {"size":0,"query":{"term":{"rule.id":"100210"}},"aggs":{"by_ip":{"terms":{"field":"data.srcip","size":6},"aggs":{"vh":{"terms":{"field":"data.vhost","size":1}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r03_webexploit.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `data.srcip` size 6 → Split rows: Terms `data.vhost` size 1 · 필터 `rule.id:"100210"`

      ## ✅ 합격 기준
      `218.136.73.91` 출력 시 통과.
