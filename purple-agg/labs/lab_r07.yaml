lab_id: purple-agg-r07
title: "퍼플 집계 R07 — 내부 이동 — 계정 하나, 서버 여러 대"
version: purple-agg-1
course: purple-agg
week: 7
description: |
  R07 내부 이동 — 관리자 계정 하나가 10분 안에 서버 여러 대로 퍼진다.

  Red(로그로만 재현) — 탈취한 관리자 계정 kim.minjun
    1) D-45~D-4: 새벽에 해외 IP 로 bastion 로그인 후 서버 1대씩 '둘러보기'(실제 로그 재방문 패턴)
    2) D-3 01:20: bastion → 서버존 포트 스캔 → 8분 안에 서버 6대 SSH, dvwa 실패
    3) neobank → KT66-WIN-01 네트워크 로그온(유형 3) → 서비스 실행 → 계정 생성·관리자 그룹 추가
  Blue: 계정×10분×호스트 수 → bastion 해외 로그인 → 동서 스캔 → 로그온 유형 → 그룹 변경 → 타임라인

  실제 공격은 하지 않는다. 생성기가 만든 로그(정상 99.9% + 공격)를 인덱서에 적재해 집계로 찾고, 같은 판단을 Suricata·ModSecurity·Wazuh·Sigma·osquery 규칙과 모니터로 자동화한 뒤 대응한다. 명령은 한 줄씩 — answer 의 연결 명령은 자동 채점용.
difficulty: medium
duration_minutes: 180
prerequisites:
  - "kt66 설치·기동 + Wazuh 인덱서 https://10.20.32.110:9200 접근 (admin)"
  - "~/purple-agg 번들 배치 (README §1~4 최초 설정)"
  - "jq, python3"
objectives:
  - "계정×10분 버킷×호스트 수 집계(bucket_selector)로 확산 구간을 찾는다"
  - "bastion 의 외부 출발지 로그인과 동서 스캔(출발지별 포트·목적지 수)을 확인한다"
  - "Windows 로그온 유형 3 + 관리자 그룹 변경으로 서버→PC 이동을 확인한다"
  - "Suricata 동서 규칙·Wazuh same_user 빈도·순서 상관(로그온→그룹 변경)·Sysmon 으로 자동화한다"
pass_threshold: 0.7
steps:

  - order: 1
    instruction: |2
      ## 🎯 목표 — 데이터 적재와 정상의 모양 — bastion 경유 서버 로그인 — 계정 × 10분 × 서로 다른 서버 수 (4대 이상만)
      ## 📖 개념 한 줄
      정상의 크기를 먼저 잰다. 관리자도 하루에 여러 서버에 들어간다. 다른 것은 속도 — 10분에 4대 이상.
      ## 💻 실행 명령 (한 줄씩 따라 실행)

      **실습 위치:** `kt66 호스트` — `ssh ccc@{{TARGET_IP}}` 접속 후 `cd ~/purple-agg` (생성기·인덱서 https://10.20.32.110:9200)

      ```bash
      # 1) 인덱서 연결 확인 — 클러스터 이름·버전, 이미 있는 purple-* 인덱스
      python3 r07_lateral.py check

      # 2) 로그 생성·적재 — 90일, 엔드포인트 10곳 정상 99.9% + 공격 (실제 공격 없음, 수 분)
      python3 r07_lateral.py gen --anchor 2026-11-01

      # 3) 적재 건수 확인 — 총 이벤트 수 | 서로 다른 외부 IP 수 (Q0)
      python3 r07_lateral.py ask Q0

      # 4) Dashboard: Stack Management → Index Patterns → purple-* (시간 필드 timestamp) — 있으면 건너뜀
      # 5) Discover 에서 purple-r07 · 기간 2026-08-01 ~ 2026-11-01 로 맞춘다

      # 6) Q1 질의 본문(DSL)을 먼저 읽는다 — 어떤 필터·버킷·지표인가
      python3 r07_lateral.py dsl Q1

      # 7) 인덱서에 직접 질의 — jq 로 '키 | 값' 표만 뽑는다
      curl -sk -u admin:SecretPassword -H 'Content-Type: application/json' https://10.20.32.110:9200/purple-r07/_search -d @- <<'EOF' | jq -r '.aggregations.u.buckets[] | .key as $k | .t.buckets[] | "\($k) | \(.key_as_string) | \(.hosts.value)"'
      {"size":0,"query":{"bool":{"filter":[{"term":{"rule.id":"5715"}},{"term":{"data.srcip":"10.20.30.201"}}]}},"aggs":{"u":{"terms":{"field":"data.srcuser","size":20},"aggs":{"t":{"date_histogram":{"field":"timestamp","fixed_interval":"10m","time_zone":"+09:00","format":"MM-dd HH:mm","min_doc_count":1},"aggs":{"hosts":{"cardinality":{"field":"agent.name"}},"many":{"bucket_selector":{"buckets_path":{"h":"hosts"},"script":"params.h >= 4"}}}}}}}}
      EOF

      # 8) 같은 질의를 생성기로 (표 출력, 정답 키와 같은 형식)
      python3 r07_lateral.py ask Q1
      ```
      - 2) 기준일 `2026-11-01` 로 고정해야 정답 키와 숫자가 같다(다른 날짜면 분포는 같고 시각만 밀린다).
      - 시각화: Split rows: Terms `data.srcuser` size 20 → Split rows: Date Histogram `timestamp` 간격 10m → Metric: Unique Count `agent.name` → 조건 거르기(bucket_selector) — Visualize 에는 없음 → DSL·모니터로 · 필터 `rule.id:"5715" and data.srcip:"10.20.30.201"`

      ## ✅ 합격 기준
      `kim.minjun` 출력 시 통과.
