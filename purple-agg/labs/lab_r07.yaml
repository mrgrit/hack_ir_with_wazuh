      docker exec kt66-siem sh -c "grep -oE 'Rule: 1907[0-9]+ \(level [0-9]+\)' /var/ossec/logs/alerts/alerts.log | sort | uniq -c"

      # 9) Sigma — kt66 변환기(단건) → 부모 연결(--fix-parents) → 상관 변환
      cp rules/r07/sigma/*.yml ~/kt66/sigma/rules/
